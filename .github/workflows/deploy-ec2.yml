name: Deploy EC2 Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-ec2-staging-main
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: pip install -e .

      - name: Syntax checks
        run: python -m py_compile frontend/web/server.py market_agent/analysis/company/news/service.py market_agent/jobs/company_updates.py

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/MarketAgent
            bash deploy/ec2/deploy.sh
