[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MarketAgent"
version = "0.1.0"
description = "A lightweight CLI/SDK to fetch stock & company info (Finnhub-powered)."
authors = [{name="Your Name"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "finnhub-python>=2.4.19",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.0.0"
]

[project.scripts]
marketagent-company-worker = "market_agent.jobs.company_updates:main"
marketagent-company-warmup = "market_agent.jobs.company_warmup:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external APIs/services",
]

[tool.setuptools.packages.find]
include = ["market_agent*", "frontend*"]
